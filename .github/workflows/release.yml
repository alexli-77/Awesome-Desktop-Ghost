name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ghost.app (universal)
        run: |
          set -e
          APP=Ghost.app
          mkdir -p "$APP/Contents/MacOS"
          cp Info.plist "$APP/Contents/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $(tr -d '[:space:]' < VERSION)" "$APP/Contents/Info.plist"
          # App icon: PNG → .icns (iconutil is macOS-only)
          ICONSET=$(mktemp -d)/Ghost.iconset
          mkdir -p "$ICONSET" "$APP/Contents/Resources"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz assets/icon_1024.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sips -z $((sz*2)) $((sz*2)) assets/icon_1024.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/Ghost.icns"
          swiftc -O -target arm64-apple-macos13.0  -o Ghost-arm64  main.swift
          swiftc -O -target x86_64-apple-macos13.0 -o Ghost-x86_64 main.swift
          lipo -create Ghost-arm64 Ghost-x86_64 -output "$APP/Contents/MacOS/Ghost"
          ln -s Ghost "$APP/Contents/MacOS/Ghost Watchdog"
          codesign --force --identifier com.yangli.ghost --sign - "$APP"
          ditto -c -k --keepParent "$APP" Ghost.app.zip
          shasum -a 256 Ghost.app.zip > Ghost.app.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghost.app
          path: Ghost.app.zip

      - name: Read version
        id: ver
        run: echo "tag=v$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # Creates the tag if it does not exist yet (so a manual run from main
      # releases whatever VERSION says), or updates the release for an
      # existing tag push.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Ghost ${{ steps.ver.outputs.tag }}
          files: |
            Ghost.app.zip
            Ghost.app.zip.sha256
          generate_release_notes: true
